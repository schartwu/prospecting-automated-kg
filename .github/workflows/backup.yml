name: Weekly backup

# Emails the Lead Loop statuses and users as CSV (scripts/backup.py). A late start does not matter here,
# so GitHub's own schedule is used: Sunday 08:00 Bangkok.
on:
  schedule:
    - cron: "0 1 * * 0"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Back up and email
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          BACKUP_RECIPIENTS: ${{ vars.BACKUP_RECIPIENTS }}
        run: python scripts/backup.py

      # Emails ADMIN_ALERT_EMAIL when a step above failed (6-8 Nov 2026 failed silently for 3 evenings).
      - name: Alert the admin if anything failed
        if: failure()
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          ADMIN_ALERT_EMAIL: ${{ vars.ADMIN_ALERT_EMAIL }}
        run: python scripts/health.py --step-failed "Weekly backup"
