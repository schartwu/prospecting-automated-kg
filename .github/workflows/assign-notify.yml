name: KG Lead hand-out email

# Emails each Sale (GXX) the leads DV / Tele handed to them since the last email (scripts/assign_notify.py).
# Run by hand for now; once approved, Supabase pg_cron starts it every hour (GitHub's own schedule can start
# hours late), with args "--send".
on:
  workflow_dispatch:
    inputs:
      args:
        description: "nothing = list only · --to a@b.com = test copies · --send = real · --app-url .../preview/"
        default: ""

concurrency:
  group: assign-notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Email new hand-outs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          ARGS: ${{ inputs.args }}
        run: python scripts/assign_notify.py $ARGS
      - name: Alert the admin if anything failed
        if: failure()
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          ADMIN_ALERT_EMAIL: ${{ vars.ADMIN_ALERT_EMAIL }}
        run: python scripts/health.py --step-failed "KG Lead hand-out email"
